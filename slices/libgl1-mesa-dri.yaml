package: libgl1-mesa-dri

essential:
  - libgl1-mesa-dri_copyright

slices:
  swrast:
    essential:
      - libc6_libs
      - libdrm-amdgpu1_libs
      - libdrm-intel1_libs
      - libdrm-nouveau2_libs
      - libdrm-radeon1_libs
      - libdrm2_libs
      - libelf1_libs
      - libexpat1_libs
      - libgcc-s1_libs
      - libglapi-mesa_libs
      - libllvm15_libs
      - libsensors5_libs
      - libstdc++6_libs
      - libxcb-dri3-0_libs
      - libzstd1_libs
      - zlib1g_libs
    contents:
      /usr/lib/*-linux-*/dri/swrast_dri.so:

  copyright:
    contents:
      /usr/share/doc/libgl1-mesa-dri/copyright:
